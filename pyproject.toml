[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ymailink"]

[project]
name = "ymailink"
version = "0.1.0"
description = "CLI email management tool"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "imapclient>=3.0",
    "aiosmtplib>=3.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
outlook = ["msal>=1.28", "httpx>=0.27"]
gmail = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
keyring = ["keyring>=25.0"]
ai = ["httpx>=0.27"]
all = ["ymailink[outlook,gmail,keyring,ai]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ymailink = "ymailink.cli:main"
