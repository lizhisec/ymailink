# ymailink configuration file
# Place this at ~/.config/ymailink/config.toml

downloads-dir = "~/Downloads"

# ---- IMAP + SMTP account ----
[accounts.personal]
default = true
email = "john@example.com"
display-name = "John Doe"

backend.type = "imap"
backend.host = "imap.example.com"
backend.port = 993
backend.encryption = "tls"
backend.login = "john@example.com"
backend.auth.type = "password"
backend.auth.cmd = "pass show email/personal"

message.send.backend.type = "smtp"
message.send.backend.host = "smtp.example.com"
message.send.backend.port = 587
message.send.backend.encryption = "tls"
message.send.backend.login = "john@example.com"
message.send.backend.auth.type = "password"
message.send.backend.auth.cmd = "pass show email/personal"

# ---- Outlook account (Microsoft Graph API) ----
[accounts.work]
email = "john@company.com"

backend.type = "outlook"
backend.client-id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
backend.tenant-id = "common"

message.send.backend.type = "outlook"
message.send.backend.client-id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
message.send.backend.tenant-id = "common"

# ---- Gmail account (Google Gmail API) ----
[accounts.gmail]
email = "john@gmail.com"

backend.type = "gmail"
backend.client-id = "xxxx.apps.googleusercontent.com"
backend.client-secret = "GOCSPX-xxxx"

message.send.backend.type = "gmail"
message.send.backend.client-id = "xxxx.apps.googleusercontent.com"
message.send.backend.client-secret = "GOCSPX-xxxx"
